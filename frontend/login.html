<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a161a;
    --card: #10252b;
    --line: #1d3d44;
    --teal: #2ec4b0;
    --teal-dark: #06302b;
    --text: #e9f3f0;
    --muted: #8fa9a7;
    --error: #ff8a80;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1020px; margin: 0 auto; padding: 24px 24px 64px; }
  .topbar { display: flex; justify-content: flex-end; }
  .ghost {
    color: var(--teal); border: 1px solid var(--teal); border-radius: 10px;
    padding: 8px 18px; font-size: 14px; text-decoration: none; background: transparent;
  }
  .ghost:hover { background: rgba(46,196,176,.1); }

  .layout { display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; align-items: start; margin-top: 48px; }

  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(40px, 6vw, 64px);
    line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 24px;
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--teal); }
  .lede { color: var(--muted); font-size: 18px; max-width: 34ch; margin: 0; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px;
  }
  .card h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 4px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font: inherit; font-size: 15px;
  }
  input::placeholder { color: #587270; }
  input:focus-visible, button:focus-visible, a:focus-visible, .check input:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 2px; border-color: var(--teal);
  }
  .pw { position: relative; }
  .pw input { padding-right: 64px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--teal); font: inherit; font-size: 13px;
    cursor: pointer; padding: 6px 8px; border-radius: 6px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 22px; font-size: 14px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .check input { accent-color: var(--teal); width: 16px; height: 16px; margin: 0; }
  .row a { color: var(--teal); text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .primary {
    width: 100%; background: var(--teal); color: var(--teal-dark); border: 0;
    border-radius: 10px; padding: 13px; font: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .6; cursor: progress; }

  .msg { min-height: 22px; margin-top: 16px; font-size: 14px; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--teal); }
  .foot { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .foot a { color: var(--teal); text-decoration: none; }
  .server { font-size: 12px; color: var(--muted); margin-top: 16px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #587270; }
  .dot.up { background: var(--teal); }
  .dot.down { background: var(--error); }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 32px; margin-top: 24px; }
    .card { padding: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><a class="ghost" href="#">Back to problems</a></div>

  <main class="layout">
    <section>
      <h1>Pick up where you <em>left off.</em></h1>
      <p class="lede">Sign in to see the problems your team is exploring and your saved briefs.</p>
    </section>

    <section class="card" aria-labelledby="signin-title">
      <h2 id="signin-title">Sign in</h2>
      <p class="sub">Use the email you registered with.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@college.edu" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="row">
          <label class="check" style="margin:0;font-weight:400"><input type="checkbox" id="remember"> Keep me signed in</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="primary" id="submit" type="submit">Sign in</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>

      <div class="foot">New here? <a href="#">Create an account</a></div>
      <div class="server"><span class="dot" id="dot"></span><span id="serverText">Checking server…</span></div>
    </section>
  </main>
</div>

<script>
  // Change this if your backend runs on another port.
  const API_BASE = "http://localhost:3000";
  const REDIRECT_AFTER_LOGIN = ""; // e.g. "dashboard.html" (leave empty to stay on this page)

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit");
  const pw = document.getElementById("password");

  document.getElementById("toggle").addEventListener("click", (e) => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    e.target.textContent = show ? "Hide" : "Show";
    e.target.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  function say(text, kind) { msg.textContent = text; msg.className = "msg " + (kind || ""); }

  // Server status check
  (async () => {
    const dot = document.getElementById("dot"), t = document.getElementById("serverText");
    try {
      const r = await fetch(API_BASE + "/api/health");
      if (!r.ok) throw 0;
      dot.className = "dot up"; t.textContent = "Connected to " + API_BASE;
    } catch {
      dot.className = "dot down"; t.textContent = "Can't reach " + API_BASE + ". Start the server first.";
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!email || !password) return say("Enter your email and password.", "error");
    if (!/^\S+@\S+\.\S+$/.test(email)) return say("Enter a valid email address.", "error");

    btn.disabled = true; btn.textContent = "Signing in…"; say("");
    try {
      const res = await fetch(API_BASE + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Sign in failed. Try again.");

      const store = document.getElementById("remember").checked ? localStorage : sessionStorage;
      store.setItem("token", data.token);
      say("Signed in as " + data.user.name + ".", "ok");
      if (REDIRECT_AFTER_LOGIN) window.location.href = REDIRECT_AFTER_LOGIN;
    } catch (err) {
      const offline = err instanceof TypeError;
      say(offline ? "Can't reach the server at " + API_BASE + ". Start it and try again." : err.message, "error");
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
